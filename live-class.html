<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Class</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

:root{
    --bg:#060912;
    --panel:#0c1220;
    --panel2:#101827;
    --border:rgba(255,255,255,.08);
    --text:#f7f8fc;
    --muted:#8b96aa;
    --primary:#6366f1;
    --primary2:#8b5cf6;
    --red:#ef4444;
    --green:#22c55e;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    background:rgba(6,9,18,.9);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:100;
}

.headerLeft{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
}

.backBtn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
}

.backBtn svg{
    width:19px;
    height:19px;
}

.classInfo{
    min-width:0;
}

.classTitle{
    font-size:16px;
    font-weight:750;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.classSubtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:9px;
}

.liveBadge{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    background:rgba(239,68,68,.12);
    color:#fca5a5;
    border:1px solid rgba(239,68,68,.2);
    border-radius:9px;
    font-size:11px;
    font-weight:800;
}

.liveDot{
    width:7px;
    height:7px;
    background:#ef4444;
    border-radius:50%;
    box-shadow:0 0 10px #ef4444;
    animation:pulse 1.3s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.4;
    }
}

.viewerBox{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    border-radius:9px;
    background:rgba(255,255,255,.04);
    color:var(--muted);
    font-size:12px;
}

.viewerBox svg{
    width:15px;
    height:15px;
}

/* ================= LAYOUT ================= */

.main{
    height:calc(100vh - 68px);
    display:grid;
    grid-template-columns:minmax(0,1fr) 350px;
}

.videoArea{
    position:relative;
    min-width:0;
    background:#020409;
    display:flex;
    flex-direction:column;
}

.videoStage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,rgba(99,102,241,.08),transparent 45%),
        #020409;
    overflow:hidden;
}

/* ================= REMOTE VIDEO ================= */

.remoteContainer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.remoteContainer video{
    width:100%;
    height:100%;
    max-height:100%;
    object-fit:contain;
    background:#000;
    border-radius:12px;
}

/*
    WebRTC teacher video created by webrtc.js
    should fill the classroom stage.
*/

.remoteContainer > div{
    position:absolute;
    inset:0;
}

.remoteContainer > div video{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:0;
}

/* ================= PLACEHOLDER ================= */

.waiting{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    z-index:3;
    pointer-events:none;
}

.waiting.hidden{
    display:none;
}

.waitingIcon{
    width:68px;
    height:68px;
    border-radius:20px;
    display:grid;
    place-items:center;
    background:rgba(99,102,241,.1);
    border:1px solid rgba(99,102,241,.2);
    margin-bottom:16px;
}

.waitingIcon svg{
    width:30px;
    height:30px;
    color:#a5b4fc;
}

.waiting h2{
    font-size:20px;
    margin-bottom:7px;
}

.waiting p{
    color:var(--muted);
    font-size:13px;
    max-width:350px;
    line-height:1.6;
}

/* ================= TEACHER LABEL ================= */

.teacherLabel{
    position:absolute;
    left:20px;
    top:20px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 12px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    font-size:12px;
}

.teacherCameraDot{
    width:7px;
    height:7px;
    background:#22c55e;
    border-radius:50%;
}

/* ================= CONNECTION ================= */

.connection{
    position:absolute;
    right:20px;
    top:20px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 11px;
    border-radius:9px;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);
    color:#86efac;
    font-size:11px;
}

.connectionDot{
    width:7px;
    height:7px;
    background:var(--green);
    border-radius:50%;
}

/* ================= CONTROLS ================= */

.controls{
    height:66px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px 15px;
    background:#080d18;
    border-top:1px solid var(--border);
}

.controlBtn{
    width:44px;
    height:44px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:white;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:.2s;
}

.controlBtn:hover{
    background:rgba(255,255,255,.08);
}

.controlBtn svg{
    width:19px;
    height:19px;
}

.leaveBtn{
    width:auto;
    padding:0 17px;
    background:rgba(239,68,68,.1);
    border-color:rgba(239,68,68,.22);
    color:#fca5a5;
}

.leaveBtn:hover{
    background:rgba(239,68,68,.18);
}

/*
    Student has NO mic/camera buttons.
*/

/* ================= SIDEBAR ================= */

.sidebar{
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0;
}

.tabs{
    height:55px;
    display:flex;
    border-bottom:1px solid var(--border);
}

.tab{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:13px;
    position:relative;
}

.tab.active{
    color:white;
}

.tab.active::after{
    content:"";
    position:absolute;
    left:20%;
    right:20%;
    bottom:0;
    height:2px;
    background:linear-gradient(
        90deg,
        var(--primary),
        var(--primary2)
    );
}

/* ================= CHAT ================= */

.chatPanel{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}

.chatMessages{
    flex:1;
    overflow-y:auto;
    padding:17px;
}

.message{
    display:flex;
    gap:9px;
    margin-bottom:15px;
}

.messageAvatar{
    width:31px;
    height:31px;
    flex:none;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    font-size:11px;
    font-weight:800;
}

.messageBody{
    min-width:0;
}

.messageName{
    font-size:11px;
    font-weight:700;
    margin-bottom:4px;
}

.messageText{
    font-size:13px;
    color:#dbe1ed;
    line-height:1.5;
    word-break:break-word;
}

.messageTime{
    color:#657084;
    font-size:9px;
    margin-top:3px;
}

.systemMessage{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:15px 5px;
}

.chatInputArea{
    padding:12px;
    border-top:1px solid var(--border);
}

.chatForm{
    display:flex;
    gap:8px;
}

.chatInput{
    flex:1;
    min-width:0;
    height:43px;
    border:1px solid var(--border);
    background:#080e19;
    color:white;
    outline:none;
    border-radius:11px;
    padding:0 13px;
    font-size:13px;
}

.chatInput:focus{
    border-color:rgba(99,102,241,.55);
}

.sendBtn{
    width:43px;
    height:43px;
    border:0;
    border-radius:11px;
    color:white;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    display:grid;
    place-items:center;
    cursor:pointer;
}

.sendBtn svg{
    width:18px;
    height:18px;
}

/* ================= PEOPLE ================= */

.peoplePanel{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:none;
}

.person{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-radius:11px;
    background:rgba(255,255,255,.025);
    margin-bottom:8px;
}

.personAvatar{
    width:34px;
    height:34px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    font-size:12px;
    font-weight:800;
}

.personName{
    flex:1;
    min-width:0;
}

.personName strong{
    display:block;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.personName span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:2px;
}

.teacherTag{
    font-size:9px;
    padding:4px 7px;
    border-radius:6px;
    background:rgba(99,102,241,.12);
    color:#a5b4fc;
}

/* ================= INFO ================= */

.infoPanel{
    flex:1;
    padding:18px;
    display:none;
}

.infoCard{
    padding:16px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:12px;
}

.infoLabel{
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:6px;
}

.infoValue{
    font-size:14px;
    line-height:1.5;
}

/* ================= LEAVE MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(380px,100%);
    background:#101827;
    border:1px solid var(--border);
    border-radius:18px;
    padding:23px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.modalBox h3{
    margin-bottom:7px;
}

.modalBox p{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.modalActions{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.modalActions button{
    flex:1;
    height:42px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
}

.confirmLeave{
    background:#dc2626 !important;
    border-color:#dc2626 !important;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(15px);
    background:#151d2d;
    border:1px solid var(--border);
    color:white;
    padding:11px 16px;
    border-radius:11px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .main{
        height:auto;
        min-height:calc(100vh - 68px);
        display:flex;
        flex-direction:column;
    }

    .videoArea{
        height:56vh;
        min-height:330px;
    }

    .sidebar{
        height:450px;
        border-left:0;
        border-top:1px solid var(--border);
    }

}

@media(max-width:550px){

    .header{
        padding:0 11px;
    }

    .classTitle{
        max-width:180px;
    }

    .viewerBox{
        display:none;
    }

    .liveBadge{
        padding:6px 8px;
    }

    .videoArea{
        height:50vh;
        min-height:280px;
    }

    .controls{
        height:60px;
        gap:7px;
    }

    .controlBtn{
        width:40px;
        height:40px;
    }

    .leaveBtn{
        padding:0 12px;
    }

    .sidebar{
        height:430px;
    }
}
</style>
</head>


<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="headerLeft">

        <button class="backBtn" id="backBtn">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M19 12H5"/>
                <path d="m12 19-7-7 7-7"/>

            </svg>

        </button>


        <div class="classInfo">

            <div class="classTitle" id="classTitle">
                Live Class
            </div>

            <div class="classSubtitle" id="classSubtitle">
                Connecting...
            </div>

        </div>

    </div>


    <div class="headerRight">

        <div class="liveBadge">

            <span class="liveDot"></span>

            LIVE

        </div>


        <div class="viewerBox">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">

                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

            </svg>

            <span id="viewerCount">0</span>

        </div>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="main">


    <!-- ================= VIDEO ================= -->

    <section class="videoArea">

        <div class="videoStage">


            <!-- WebRTC remote videos will appear here -->

            <div
                id="remoteContainer"
                class="remoteContainer">
            </div>


            <!-- Waiting screen -->

            <div
                id="waiting"
                class="waiting">

                <div class="waitingIcon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"/>

                        <path d="m10 9 5 3-5 3V9Z"/>

                    </svg>

                </div>

                <h2>Connecting to teacher...</h2>

                <p>
                    Please wait while the live class video connects.
                </p>

            </div>


            <!-- Teacher label -->

            <div
                class="teacherLabel"
                id="teacherLabel">

                <span class="teacherCameraDot"></span>

                <span id="teacherName">
                    Teacher
                </span>

            </div>


            <!-- Connection -->

            <div
                class="connection"
                id="connection">

                <span class="connectionDot"></span>

                <span id="connectionText">
                    Connecting
                </span>

            </div>

        </div>


        <!-- ================= STUDENT CONTROLS ================= -->

        <div class="controls">

            <!-- NO MICROPHONE BUTTON -->

            <!-- NO CAMERA BUTTON -->


            <button
                class="controlBtn"
                id="fullscreenBtn"
                title="Fullscreen">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
                    <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

                </svg>

            </button>


            <button
                class="controlBtn leaveBtn"
                id="leaveBtn">

                Leave Class

            </button>

        </div>

    </section>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">


        <div class="tabs">

            <button
                class="tab active"
                data-tab="chat">

                Chat

            </button>


            <button
                class="tab"
                data-tab="people">

                People

            </button>


            <button
                class="tab"
                data-tab="info">

                Info

            </button>

        </div>


        <!-- ================= CHAT ================= -->

        <div
            class="chatPanel"
            id="chatPanel">

            <div
                class="chatMessages"
                id="chatMessages">

                <div class="systemMessage">
                    You joined the live class.
                </div>

            </div>


            <div class="chatInputArea">

                <form
                    class="chatForm"
                    id="chatForm">

                    <input
                        id="chatInput"
                        class="chatInput"
                        type="text"
                        maxlength="500"
                        autocomplete="off"
                        placeholder="Type a message...">

                    <button
                        class="sendBtn"
                        type="submit"
                        title="Send">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">

                            <path d="M22 2 11 13"/>
                            <path d="m22 2-7 20-4-9-9-4 20-7Z"/>

                        </svg>

                    </button>

                </form>

            </div>

        </div>


        <!-- ================= PEOPLE ================= -->

        <div
            class="peoplePanel"
            id="peoplePanel">

        </div>


        <!-- ================= INFO ================= -->

        <div
            class="infoPanel"
            id="infoPanel">

            <div class="infoCard">

                <div class="infoLabel">
                    Class
                </div>

                <div
                    class="infoValue"
                    id="infoTitle">
                    —
                </div>

            </div>


            <div class="infoCard">

                <div class="infoLabel">
                    Subject
                </div>

                <div
                    class="infoValue"
                    id="infoSubject">
                    —
                </div>

            </div>


            <div class="infoCard">

                <div class="infoLabel">
                    Chapter
                </div>

                <div
                    class="infoValue"
                    id="infoChapter">
                    —
                </div>

            </div>


            <div class="infoCard">

                <div class="infoLabel">
                    Teacher
                </div>

                <div
                    class="infoValue"
                    id="infoTeacher">
                    —
                </div>

            </div>

        </div>

    </aside>

</main>


<!-- ================= LEAVE MODAL ================= -->

<div
    class="modal"
    id="leaveModal">

    <div class="modalBox">

        <h3>Leave live class?</h3>

        <p>
            You can join the class again while it is still live.
        </p>


        <div class="modalActions">

            <button id="cancelLeave">
                Cancel
            </button>

            <button
                id="confirmLeave"
                class="confirmLeave">

                Leave

            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script type="module">

import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    collection,
    onSnapshot,
    addDoc,
    serverTimestamp
} from "./firebase.js";


import {
    joinRoom,
    leaveRoom,
    getConnectionCount
} from "./webrtc.js";


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let roomId = null;

let liveData = null;

let participantUnsubscribe = null;

let chatUnsubscribe = null;

let joined = false;


/* =====================================================
   URL ROOM ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

roomId = params.get("room");


/* =====================================================
   ELEMENTS
===================================================== */

const classTitle =
    document.getElementById("classTitle");

const classSubtitle =
    document.getElementById("classSubtitle");

const teacherName =
    document.getElementById("teacherName");

const viewerCount =
    document.getElementById("viewerCount");

const connectionText =
    document.getElementById("connectionText");

const waiting =
    document.getElementById("waiting");

const remoteContainer =
    document.getElementById("remoteContainer");

const chatMessages =
    document.getElementById("chatMessages");

const chatForm =
    document.getElementById("chatForm");

const chatInput =
    document.getElementById("chatInput");

const peoplePanel =
    document.getElementById("peoplePanel");

const chatPanel =
    document.getElementById("chatPanel");

const infoPanel =
    document.getElementById("infoPanel");

const leaveModal =
    document.getElementById("leaveModal");

const toast =
    document.getElementById("toast");


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser = user;


        if(!roomId){

            showToast(
                "Live room not found"
            );

            setTimeout(()=>{
                window.location.href =
                    "home.html";
            },1500);

            return;

        }


        await loadLiveClass();

    }
);


/* =====================================================
   LOAD LIVE CLASS
===================================================== */

async function loadLiveClass(){

    try{

        const liveRef =
            doc(
                db,
                "liveClasses",
                roomId
            );


        const snap =
            await getDoc(liveRef);


        if(!snap.exists()){

            showToast(
                "This live class does not exist"
            );

            setTimeout(()=>{
                window.location.href =
                    "home.html";
            },1800);

            return;

        }


        liveData =
            snap.data();


        if(liveData.status !== "live"){

            showToast(
                "This live class has ended"
            );

            setTimeout(()=>{
                window.location.href =
                    "home.html";
            },1800);

            return;

        }


        /*
         * Make sure the roomId stored inside
         * Firestore matches the URL.
         */

        if(!liveData.roomId){

            console.warn(
                "No roomId field. Using document ID."
            );

            liveData.roomId = roomId;

        }


        setupClassInfo();

        await joinStudentRoom();

        listenParticipants();

        listenChat();

    }catch(error){

        console.error(error);

        showToast(
            "Unable to open live class"
        );

    }

}


/* =====================================================
   CLASS INFO
===================================================== */

function setupClassInfo(){

    const title =
        liveData.title ||
        "Live Class";


    const subject =
        liveData.subject ||
        "";


    const chapter =
        liveData.chapter ||
        "";


    const teacher =
        liveData.teacherName ||
        "Teacher";


    classTitle.textContent =
        title;


    classSubtitle.textContent =
        [subject,chapter]
        .filter(Boolean)
        .join(" • ") ||
        "Live Class";


    teacherName.textContent =
        teacher;


    document.getElementById(
        "infoTitle"
    ).textContent =
        title;


    document.getElementById(
        "infoSubject"
    ).textContent =
        subject || "—";


    document.getElementById(
        "infoChapter"
    ).textContent =
        chapter || "—";


    document.getElementById(
        "infoTeacher"
    ).textContent =
        teacher;

}


/* =====================================================
   JOIN STUDENT ROOM
===================================================== */

async function joinStudentRoom(){

    try{

        /*
         * VERY IMPORTANT
         *
         * localVideo = null
         *
         * Therefore webrtc.js will NOT call
         * getUserMedia() for the student.
         *
         * Student camera = OFF
         * Student microphone = OFF
         */

        await joinRoom(
            roomId,
            false,
            remoteContainer,
            null
        );


        joined = true;


        /*
         * The teacher's WebRTC stream will be
         * inserted into remoteContainer by webrtc.js.
         */

        waiting.classList.remove("hidden");


        connectionText.textContent =
            "Connected";


        /*
         * Give WebRTC a little time to create
         * the remote video.
         */

        setTimeout(
            checkRemoteVideo,
            1200
        );


        setInterval(
            checkRemoteVideo,
            2000
        );

    }catch(error){

        console.error(
            "Join error:",
            error
        );

        connectionText.textContent =
            "Connection failed";

        showToast(
            "Unable to connect to teacher"
        );

    }

}


/* =====================================================
   CHECK TEACHER VIDEO
===================================================== */

function checkRemoteVideo(){

    const videos =
        remoteContainer.querySelectorAll(
            "video"
        );


    let hasVideo = false;


    videos.forEach(video => {

        if(video.srcObject){

            hasVideo = true;

            video.autoplay = true;

            video.playsInline = true;

            video.muted = true;

        }

    });


    if(hasVideo){

        waiting.classList.add(
            "hidden"
        );

        connectionText.textContent =
            "Teacher connected";

    }

}


/* =====================================================
   PARTICIPANTS
===================================================== */

function listenParticipants(){

    const participantsRef =
        collection(
            db,
            "liveClasses",
            roomId,
            "participants"
        );


    participantUnsubscribe =
        onSnapshot(

            participantsRef,

            snapshot => {

                let count = 0;

                const people = [];


                snapshot.forEach(
                    participantDoc => {

                        const data =
                            participantDoc.data();


                        /*
                         * Count all students
                         * plus teacher.
                         */

                        count++;


                        people.push({
                            id:participantDoc.id,
                            ...data
                        });

                    }
                );


                viewerCount.textContent =
                    count;


                renderPeople(people);

            },

            error => {

                console.error(
                    "Participants error:",
                    error
                );

            }

        );

}


/* =====================================================
   PEOPLE UI
===================================================== */

function renderPeople(people){

    peoplePanel.innerHTML = "";


    if(!people.length){

        peoplePanel.innerHTML = `
            <div class="systemMessage">
                No participants found.
            </div>
        `;

        return;

    }


    people.forEach(person => {

        const name =
            person.name ||
            "Student";


        const isTeacher =
            person.role === "teacher";


        const item =
            document.createElement("div");

        item.className =
            "person";


        item.innerHTML = `

            <div class="personAvatar">

                ${getInitial(name)}

            </div>


            <div class="personName">

                <strong>
                    ${escapeHTML(name)}
                </strong>

                <span>
                    ${
                        isTeacher
                        ? "Teacher"
                        : "Student"
                    }
                </span>

            </div>


            ${
                isTeacher
                ?
                `
                <div class="teacherTag">
                    TEACHER
                </div>
                `
                :
                ""
            }

        `;


        peoplePanel.appendChild(item);

    });

}


/* =====================================================
   CHAT REAL-TIME
===================================================== */

function listenChat(){

    const chatRef =
        collection(
            db,
            "liveClasses",
            roomId,
            "chat"
        );


    chatUnsubscribe =
        onSnapshot(

            chatRef,

            snapshot => {

                const messages = [];


                snapshot.forEach(
                    messageDoc => {

                        messages.push({
                            id:messageDoc.id,
                            ...messageDoc.data()
                        });

                    }
                );


                messages.sort(
                    (a,b)=>
                        getTime(a.createdAt) -
                        getTime(b.createdAt)
                );


                renderChat(messages);

            },

            error => {

                console.error(
                    "Chat error:",
                    error
                );

            }

        );

}


/* =====================================================
   SEND CHAT
===================================================== */

chatForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const text =
            chatInput.value.trim();


        if(!text){

            return;

        }


        if(!currentUser){

            return;

        }


        chatInput.disabled = true;


        try{

            await addDoc(

                collection(
                    db,
                    "liveClasses",
                    roomId,
                    "chat"
                ),

                {
                    uid:currentUser.uid,

                    name:
                        currentUser.displayName ||
                        currentUser.email?.split("@")[0] ||
                        "Student",

                    photoURL:
                        currentUser.photoURL ||
                        "",

                    text:text,

                    createdAt:
                        serverTimestamp()

                }

            );


            chatInput.value = "";


        }catch(error){

            console.error(error);

            showToast(
                "Message could not be sent"
            );

        }finally{

            chatInput.disabled = false;

            chatInput.focus();

        }

    }
);


/* =====================================================
   RENDER CHAT
===================================================== */

function renderChat(messages){

    chatMessages.innerHTML = "";


    if(!messages.length){

        chatMessages.innerHTML = `
            <div class="systemMessage">
                No messages yet. Start the conversation.
            </div>
        `;

        return;

    }


    messages.forEach(message => {

        const name =
            message.name ||
            "Student";


        const item =
            document.createElement("div");

        item.className =
            "message";


        item.innerHTML = `

            <div class="messageAvatar">

                ${getInitial(name)}

            </div>


            <div class="messageBody">

                <div class="messageName">

                    ${escapeHTML(name)}

                </div>


                <div class="messageText">

                    ${escapeHTML(
                        message.text || ""
                    )}

                </div>


                <div class="messageTime">

                    ${formatTime(
                        message.createdAt
                    )}

                </div>

            </div>

        `;


        chatMessages.appendChild(item);

    });


    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}

   TABS
===================================================== */

document

document
    .getElementById("fullscreenBtn")

document
    .getElementById("backBtn")

    );


/* =====================================================
   LEAVE
===================================================== */

document
    .getElementById("leaveBtn")
    .addEventListener(
        "click",
        ()=>{

            showLeaveModal();

        }
    );


function showLeaveModal(){

    leaveModal.classList.add(
        "show"
    );

}


document
    .getElementById("cancelLeave")
    .addEventListener(
        "click",
        ()=>{

            leaveModal.classList.remove(
                "show"

        }
    );

    .getElementById("confirmLeave")
    .addEventListener(

        async ()=>{

        }
    );


/* =====================================================
   EXIT CLASS
===================================================== */

async function exitClass(){

    try{

        if(joined){

            await leaveRoom();

            joined = false;

        }

    }catch(error){

        console.error(error);

    }


    if(participantUnsubscribe){

        participantUnsubscribe();

    }


    if(chatUnsubscribe){

        chatUnsubscribe();

    }


    window.location.href =
        "home.html";

}


/* =====================================================
   HELPERS
===================================================== */

function getTime(value){

    if(!value){

        return Date.now();

    }


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(value.seconds){

        return value.seconds * 1000;

    }


    return Date.now();

}


function formatTime(value){

    if(!value){

        return "";

    }


    const date =
        new Date(
            getTime(value)
        );


    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function getInitial(name){

    return String(name || "S")
        .trim()
        .charAt(0)
        .toUpperCase();

}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   BEFORE UNLOAD
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(participantUnsubscribe){

            participantUnsubscribe();

        }


        if(chatUnsubscribe){

            chatUnsubscribe();

        }

        /*
         * leaveRoom cannot be reliably awaited
         * during beforeunload.
         */

        try{

            leaveRoom();

        }catch(error){

            console.error(error);

        }

    }
);
